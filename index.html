<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9B8BF4">
<title>KET 单词乐园</title>

<script>
(function(){
  'use strict';
  window.__KET_ERRORS__ = [];
  window.__KET_SHOW_ERROR__ = function(msg){
    try {
      var box = document.getElementById('global-error');
      var el  = document.getElementById('global-error-msg');
      if (box && el) {
        el.textContent = String(msg || '页面遇到了一点小问题');
        box.style.display = 'flex';
      } else {
        window.__KET_ERRORS__.push({ msg: String(msg || '页面遇到了一点小问题') });
      }
    } catch(e){}
  };
  window.addEventListener('error', function(e){
    try {
      var m = e && e.message ? e.message : '页面脚本错误';
      window.__KET_SHOW_ERROR__(m);
    } catch(err){}
  });
  window.addEventListener('unhandledrejection', function(e){
    try {
      var m = (e && e.reason && e.reason.message) ? e.reason.message : '异步操作错误';
      window.__KET_SHOW_ERROR__(m);
    } catch(err){}
  });
})();
</script>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --pink:#FF8FB1;--blue:#5BC8F5;--purple:#9B8BF4;--yellow:#FFCB47;
    --green:#5FD68A;--orange:#FF9F5A;
    --text:#3A3357;--muted:#9B93B5;--line:#F0E9FF;
  }
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);display:flex;justify-content:center;
    background:#EAF6FF;-webkit-user-select:none;user-select:none;
  }
  #app{
    width:100%;max-width:520px;height:100vh;height:100dvh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#EAF6FF 0%,#FFF9EF 38%,#FFF3F8 100%);
    overflow:hidden;position:relative;box-shadow:0 0 40px rgba(120,110,200,.12);
  }
  .topbar{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
    background:linear-gradient(120deg,#7FD8F7,#9B8BF4 48%,#FF8FB1);
    border-radius:0 0 28px 28px;color:#fff;
    box-shadow:0 6px 20px rgba(155,139,244,.28);
    position:relative;z-index:5;
  }
  .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
  .avatar-btn{
    flex:none;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.30);border:2px solid rgba(255,255,255,.55);
    display:grid;place-items:center;font-size:22px;cursor:pointer;transition:.15s;
  }
  .avatar-btn:active{transform:scale(.92)}
  .user-info{min-width:0}
  .user-greeting{
    font-size:11px;opacity:.9;font-weight:700;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .user-name{
    font-size:16px;font-weight:800;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;
  }
  .user-name .edit-icon{font-size:11px;margin-left:4px;opacity:.75}
  .streak{
    font-size:13px;font-weight:800;background:rgba(255,255,255,.30);
    padding:6px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);
    white-space:nowrap;
  }
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 26px}
  .tabbar{
    flex:none;display:flex;background:#fff;border-radius:24px 24px 0 0;
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-shadow:0 -4px 20px rgba(155,139,244,.12);
  }
  .tabbar button{
    flex:1;border:0;background:none;padding:10px 0 11px;font-size:11px;color:#B0A9C9;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
    font-family:inherit;transition:.15s;font-weight:600;
  }
  .tabbar button i{font-size:21px;line-height:1;font-style:normal;transition:transform .18s}
  .tabbar button.active{color:var(--purple);font-weight:800}
  .tabbar button.active i{transform:scale(1.18) translateY(-1px)}
  .card{
    background:#fff;border-radius:24px;padding:18px;border:3px solid #F5F1FF;
    box-shadow:0 5px 0 rgba(155,139,244,.09),0 12px 26px rgba(155,139,244,.10);
    margin-bottom:16px;
  }
  .card.center{text-align:center}
  h2{margin:8px 0 6px;font-size:21px;font-weight:800}
  .muted{color:var(--muted);font-size:14px;margin:6px 0;font-weight:600}
  .small{font-size:12px}
  .big-emoji{font-size:56px;line-height:1.1}
  .btn{
    display:block;width:100%;border:0;border-radius:999px;padding:17px;font-size:17px;
    font-weight:800;font-family:inherit;cursor:pointer;color:#fff;letter-spacing:.5px;
    background:linear-gradient(180deg,#A595F7,#7C6BF0);
    box-shadow:0 6px 0 #5F4FD1,0 12px 22px rgba(124,107,240,.28);
    margin-bottom:16px;transition:transform .1s,box-shadow .1s;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #5F4FD1}
  .btn.ghost{
    background:#fff;color:#8B7CF0;border:2.5px solid #E4DDFF;
    box-shadow:0 4px 0 #EAE3FF;
  }
  .btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 #EAE3FF}
  .btn.small{padding:12px;font-size:15px;margin-bottom:0}
  .hero{
    background:linear-gradient(140deg,#FFFFFF,#F8F4FF);
    border-radius:26px;padding:20px;border:3px solid #F5F1FF;
    box-shadow:0 5px 0 rgba(155,139,244,.09),0 12px 26px rgba(155,139,244,.10);
    margin-bottom:16px;
  }
  .hero-row{display:flex;align-items:center;gap:14px}
  .hero-emoji{
    font-size:38px;line-height:1;flex:none;
    width:64px;height:64px;border-radius:22px;display:grid;place-items:center;
    background:linear-gradient(140deg,#FFF3D6,#FFE3EE);
  }
  .hero-title{font-size:18px;font-weight:800;margin-bottom:4px}
  .hero-sub{font-size:13px;color:var(--muted);font-weight:600}
  .stars-row{display:flex;flex-wrap:wrap;gap:3px;margin:16px 0 6px;justify-content:center}
  .star{font-size:19px;opacity:.25;transition:.25s;line-height:1}
  .star.on{opacity:1}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .hero-stats div{
    background:#F8F5FF;border-radius:16px;padding:11px 6px;text-align:center;
    border:2px solid #F0E9FF;
  }
  .hero-stats b{display:block;font-size:19px;color:var(--purple);font-weight:800}
  .hero-stats small{font-size:11px;color:var(--muted);font-weight:700}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{
    background:#fff;border-radius:18px;padding:14px 6px;text-align:center;
    border:3px solid #F5F1FF;box-shadow:0 4px 0 rgba(155,139,244,.08);
  }
  .stat b{display:block;font-size:20px;color:var(--purple);font-weight:800}
  .stat small{font-size:11px;color:var(--muted);font-weight:700}
  .week{display:flex;gap:6px;justify-content:space-between;margin-top:12px}
  .day{flex:1;text-align:center}
  .day .dot{
    width:100%;aspect-ratio:1;max-width:38px;margin:0 auto;border-radius:12px;
    background:#F3F0FC;display:grid;place-items:center;font-size:15px;color:#C9C2E0;
    transition:.2s;font-weight:700;
  }
  .day .dot.on{background:linear-gradient(140deg,#7FD8F7,#9B8BF4);color:#fff;
    box-shadow:0 3px 10px rgba(155,139,244,.35)}
  .day .dot.today{outline:2.5px solid var(--pink);outline-offset:2px}
  .day small{display:block;font-size:10px;color:var(--muted);margin-top:5px;font-weight:700}
  .flash-card{perspective:1100px;height:260px;margin-bottom:18px;cursor:pointer}
  .flash-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.35,.1,.25,1);
  }
  .flash-card.flipped .flash-inner{transform:rotateY(180deg)}
  .flash-face{
    position:absolute;top:0;left:0;right:0;bottom:0;
    border-radius:28px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:22px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  .flash-front{
    background:#fff;border:3px solid #F0E9FF;
    box-shadow:0 7px 0 rgba(155,139,244,.12),0 16px 32px rgba(155,139,244,.16);
  }
  .flash-back{
    background:linear-gradient(150deg,#9B8BF4,#7FD8F7 90%);
    color:#fff;transform:rotateY(180deg);
    box-shadow:0 7px 0 rgba(95,79,209,.35),0 16px 32px rgba(124,107,240,.32);
  }
  .flash-tag{
    position:absolute;top:14px;left:16px;font-size:12px;font-weight:800;
    background:#F5F1FF;color:#8B7CF0;padding:5px 12px;border-radius:999px;
    max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .flash-back .flash-tag{background:rgba(255,255,255,.30);color:#fff}
  .sound-btn{
    position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;
    border:0;background:#F5F1FF;font-size:19px;cursor:pointer;
    display:grid;place-items:center;transition:.12s;
  }
  .sound-btn:active{transform:scale(.9)}
  .flash-back .sound-btn{background:rgba(255,255,255,.28)}
  .flash-word{
    font-size:38px;font-weight:900;color:#3A3357;
    letter-spacing:.5px;word-break:break-word;text-align:center;line-height:1.15;
  }
  .flash-cn{
    font-size:28px;font-weight:900;text-align:center;
    text-shadow:0 2px 10px rgba(60,40,140,.20);line-height:1.3;
  }
  .flash-hint{
    position:absolute;bottom:16px;left:0;right:0;text-align:center;
    font-size:12px;color:#BEB6D6;font-weight:700;
  }
  .flash-back .flash-hint{color:rgba(255,255,255,.80)}
  .answer-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .ans-btn{
    border:0;border-radius:22px;padding:14px 6px;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:15px;font-weight:800;color:#fff;letter-spacing:.5px;
    transition:transform .1s,box-shadow .1s;
  }
  .ans-emoji{font-size:27px;line-height:1}
  .ans-no{background:linear-gradient(180deg,#FFAB86,#FF7B54);box-shadow:0 6px 0 #DE5C36}
  .ans-no:active{transform:translateY(5px);box-shadow:0 1px 0 #DE5C36}
  .ans-yes{background:linear-gradient(180deg,#7BE39B,#3FC97A);box-shadow:0 6px 0 #29A25C}
  .ans-yes:active{transform:translateY(5px);box-shadow:0 1px 0 #29A25C}
  .bar{height:10px;background:#F1EDFC;border-radius:999px;overflow:hidden;margin:8px 0 16px}
  .bar i{
    display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,#7FD8F7,#9B8BF4,#FF8FB1);
    transition:width .35s;
  }
  .learn-top{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;
  }
  .q-word{
    font-size:34px;font-weight:900;text-align:center;
    margin:6px 0 4px;color:#3A3357;word-break:break-word;
  }
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:2.5px solid #F0E9FF;background:#fff;border-radius:18px;padding:15px 16px;
    font-size:16px;font-family:inherit;font-weight:700;color:var(--text);
    margin-bottom:10px;cursor:pointer;transition:.12s;
  }
  .opt .k{
    width:26px;height:26px;border-radius:9px;background:#F3F0FC;color:#9B93B5;
    display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;
  }
  .opt.right{border-color:#5FD68A;background:#EDFBF3}
  .opt.right .k{background:#5FD68A;color:#fff}
  .opt.wrong{border-color:#FF8FB1;background:#FFF1F5}
  .opt.wrong .k{background:#FF8FB1;color:#fff}
  .search-wrap{margin-bottom:14px}
  .search-wrap input{
    width:100%;border:3px solid #F0E9FF;background:#fff;border-radius:20px;
    padding:14px 18px;font-size:15px;font-family:inherit;font-weight:700;
    color:var(--text);outline:none;box-shadow:0 4px 0 rgba(155,139,244,.07);
  }
  .search-wrap input:focus{border-color:#C9BDFF}
  .word-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#fff;border-radius:18px;padding:13px 15px;margin-bottom:9px;
    border:3px solid #F7F4FF;box-shadow:0 3px 0 rgba(155,139,244,.06);
  }
  .wr-w{font-size:16px;font-weight:800}
  .wr-z{font-size:13px;color:var(--muted);margin-top:3px;font-weight:600}
  .wr-right{display:flex;align-items:center;gap:8px;flex:none}
  .badge{font-size:10px;padding:4px 9px;border-radius:999px;font-weight:800;white-space:nowrap}
  .badge.new{background:#F3F0FC;color:#A79FC4}
  .badge.learning{background:#FFF6E0;color:#C99012}
  .badge.mastered{background:#E9FBF1;color:#14A06B}
  .icon-btn{
    border:0;background:#F5F1FF;border-radius:11px;width:34px;height:34px;
    font-size:15px;cursor:pointer;line-height:1;display:grid;place-items:center;
  }
  .seg{display:flex;gap:9px;margin-top:12px}
  .seg button{
    flex:1;border:2.5px solid #EDE7FF;background:#fff;border-radius:16px;padding:12px 0;
    font-size:15px;font-weight:800;font-family:inherit;color:var(--muted);
    cursor:pointer;transition:.15s;
  }
  .seg button.on{border-color:#9B8BF4;color:#7C6BF0;background:#F3EFFF;
    box-shadow:0 3px 0 #DED3FF}
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:2px dashed #F3F0FC;font-size:15px;font-weight:700;
  }
  .row:last-child{border-bottom:0}
  .row b{color:var(--purple)}
  .tip{background:#FFFBF0;border-color:#FFEFCB}
  .tip b{font-size:14px;display:block}
  .tip p{font-size:13px;color:#9E8749;margin:8px 0 0;line-height:1.7;font-weight:600}
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:rgba(58,51,87,.94);color:#fff;font-size:14px;font-weight:700;
    padding:12px 22px;border-radius:999px;z-index:99;pointer-events:none;
    white-space:nowrap;
  }
  .result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .result-grid div{background:#F8F5FF;border-radius:16px;padding:13px 4px;border:2px solid #F0E9FF}
  .result-grid b{display:block;font-size:20px;color:var(--purple);font-weight:800}
  .result-grid small{font-size:11px;color:var(--muted);font-weight:700}
  #global-error{
    display:none;position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(30,24,54,.55);z-index:9999;
    align-items:center;justify-content:center;padding:20px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  #global-error .g-box{
    background:#fff;border-radius:22px;padding:24px 20px;max-width:340px;width:100%;
    text-align:center;box-shadow:0 20px 60px rgba(40,30,80,.35);
    border:3px solid #F5F1FF;
  }
  #global-error .g-emoji{font-size:44px;line-height:1;margin-bottom:8px}
  #global-error h3{margin:0 0 8px;font-size:18px;color:#3A3357}
  #global-error p{
    margin:0 0 16px;font-size:14px;color:#6B6280;
    word-break:break-word;line-height:1.6;font-weight:600;
  }
  #global-error button{
    border:0;border-radius:999px;padding:12px 26px;font-size:15px;font-weight:800;
    font-family:inherit;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#A595F7,#7C6BF0);
    box-shadow:0 4px 0 #5F4FD1;
  }
  .tabbar button i::before{display:inline-block;min-width:1em}

  .name-modal{
    display:none;position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(30,24,54,.55);z-index:9000;
    align-items:center;justify-content:center;padding:20px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .name-modal.show{display:flex}
  .name-modal .nm-box{
    background:#fff;border-radius:26px;padding:26px 22px;max-width:360px;width:100%;
    text-align:center;box-shadow:0 24px 60px rgba(40,30,80,.40);
    border:3px solid #F5F1FF;position:relative;
  }
  .name-modal .nm-emoji{font-size:56px;line-height:1;margin-bottom:8px}
  .name-modal h3{margin:0 0 8px;font-size:20px;font-weight:800;color:#3A3357}
  .name-modal .nm-tip{
    margin:0 0 18px;font-size:13px;color:var(--muted);font-weight:600;line-height:1.6;
  }
  .name-modal input{
    width:100%;border:3px solid #E4DDFF;background:#FAF8FF;
    border-radius:16px;padding:14px 18px;font-size:17px;font-weight:800;
    font-family:inherit;color:var(--text);outline:none;text-align:center;
    margin-bottom:14px;transition:.15s;
  }
  .name-modal input:focus{border-color:#9B8BF4;background:#fff}
  .name-modal input::placeholder{color:#C9C2E0;font-weight:600}
  .name-modal .nm-avatars{
    display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;
  }
  .name-modal .nm-avatars button{
    width:46px;height:46px;border-radius:50%;border:2.5px solid #F0E9FF;
    background:#fff;font-size:24px;cursor:pointer;transition:.12s;
    display:grid;place-items:center;padding:0;
  }
  .name-modal .nm-avatars button:active{transform:scale(.9)}
  .name-modal .nm-avatars button.on{
    border-color:#9B8BF4;background:#F3EFFF;transform:scale(1.08);
    box-shadow:0 3px 10px rgba(155,139,244,.35);
  }
  .name-modal .nm-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .name-modal .nm-btn{
    border:0;border-radius:999px;padding:14px;font-size:16px;font-weight:800;
    font-family:inherit;cursor:pointer;transition:transform .1s;
  }
  .name-modal .nm-btn.confirm{
    background:linear-gradient(180deg,#A595F7,#7C6BF0);color:#fff;
    box-shadow:0 5px 0 #5F4FD1;
  }
  .name-modal .nm-btn.confirm:active{transform:translateY(4px);box-shadow:0 1px 0 #5F4FD1}
  .name-modal .nm-btn.cancel{
    background:#fff;color:#8B7CF0;border:2.5px solid #E4DDFF;
    box-shadow:0 4px 0 #EAE3FF;
  }
  .name-modal .nm-btn.cancel:active{transform:translateY(3px);box-shadow:0 1px 0 #EAE3FF}

  .spell-wrap{
    background:#fff;border-radius:24px;padding:20px 18px;
    border:3px solid #F0E9FF;box-shadow:0 5px 0 rgba(155,139,244,.09);
    margin-bottom:16px;
  }
  .spell-title{
    text-align:center;font-size:15px;font-weight:800;color:var(--purple);
    margin-bottom:4px;
  }
  .spell-cn{
    text-align:center;font-size:22px;font-weight:900;color:#3A3357;
    margin:8px 0 6px;line-height:1.3;
  }
  .spell-hint-line{
    text-align:center;font-size:12px;color:var(--muted);font-weight:700;
    margin-bottom:14px;
  }
  .spell-input-wrap{position:relative;margin-bottom:14px}
  .spell-input{
    width:100%;border:3px solid #E4DDFF;background:#FAF8FF;
    border-radius:16px;padding:16px 50px 16px 18px;
    font-size:22px;font-weight:800;font-family:inherit;
    color:var(--text);outline:none;text-align:center;
    letter-spacing:2px;transition:.15s;
  }
  .spell-input:focus{border-color:#9B8BF4;background:#fff}
  .spell-input.ok{border-color:#5FD68A;background:#EDFBF3;color:#14A06B}
  .spell-input.bad{border-color:#FF8FB1;background:#FFF1F5;color:#E0526E}
  .spell-speak{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    border:0;background:#F5F1FF;border-radius:50%;width:40px;height:40px;
    font-size:18px;cursor:pointer;display:grid;place-items:center;
  }
  .spell-speak:active{transform:translateY(-50%) scale(.9)}
  .spell-feedback{
    min-height:26px;text-align:center;font-size:14px;font-weight:800;
    margin-bottom:12px;transition:.15s;
  }
  .spell-feedback.ok{color:#14A06B}
  .spell-feedback.bad{color:#E0526E}
  .spell-tries{
    display:flex;justify-content:center;gap:6px;margin-bottom:14px;
  }
  .spell-tries .dot-try{

var PROFILE_KEY = 'ket_profile_v1';
var DEFAULT_NAME = '小勇士';
var DEFAULT_AVATAR = '\uD83D\uDC36';
var AVATAR_OPTIONS = [
  '\uD83D\uDC36','\uD83D\uDC31','\uD83D\uDC30','\uD83D\uDC3C','\uD83E\uDD8A',
  '\uD83D\uDC3B','\uD83D\uDC35','\uD83D\uDC2F','\uD83D\uDC3E','\uD83E\uDD84',

  '\uD83C\uDFAF'

var PROFILE = { name: DEFAULT_NAME, avatar: DEFAULT_AVATAR, created: false };

(function loadProfile(){
  try {
    var raw = localStorage.getItem(PROFILE_KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && typeof p === 'object'){
        if(typeof p.name === 'string' && p.name.trim()) PROFILE.name = p.name.trim().slice(0,12);
        if(typeof p.avatar === 'string' && p.avatar) PROFILE.avatar = p.avatar;
        if(p.created === true) PROFILE.created = true;
      }
    }
  } catch(e){}
})();
function saveProfile(){ try { localStorage.setItem(PROFILE_KEY, JSON.stringify(PROFILE)); } catch(e){} }

var nameModalEl = null, nmInputEl = null;
var nmSelectedAvatar = DEFAULT_AVATAR;
var nameModalMode = 'create';

function openNameModal(mode){
  nameModalMode = mode || 'edit';
  nmSelectedAvatar = PROFILE.avatar || DEFAULT_AVATAR;
  if(!nameModalEl){
    nameModalEl = document.getElementById('nameModal');
    nmInputEl = document.getElementById('nmInput');
  }
  if(!nameModalEl || !nmInputEl) return;

  var titleEl = document.getElementById('nmTitle');
  var tipEl = document.getElementById('nmTip');
  var emojiEl = document.getElementById('nmEmoji');
  var cancelBtn = document.getElementById('nmCancelBtn');

  if(nameModalMode === 'create'){
    if(titleEl) titleEl.textContent = '欢迎来到 KET 单词乐园！';
    if(tipEl) tipEl.textContent = '给自己起一个名字吧，可以随时修改哦～';
    if(cancelBtn) cancelBtn.style.display = 'none';
  } else {
    if(titleEl) titleEl.textContent = '修改你的名字';
    if(tipEl) tipEl.textContent = '换一个更喜欢的名字或头像吧～';
    if(cancelBtn) cancelBtn.style.display = '';
  }
  if(emojiEl) emojiEl.textContent = nmSelectedAvatar;

  renderAvatarOptions();
  nmInputEl.value = (nameModalMode === 'create') ? '' : (PROFILE.name || '');
  nameModalEl.classList.add('show');
  setTimeout(function(){ try { nmInputEl.focus(); } catch(e){} }, 120);
}
function closeNameModal(){
  if(!nameModalEl) nameModalEl = document.getElementById('nameModal');
  if(nameModalEl) nameModalEl.classList.remove('show');
}
function renderAvatarOptions(){
  var wrap = document.getElementById('nmAvatars');
  if(!wrap) return;
  var html = '';
  for(var i=0; i<AVATAR_OPTIONS.length; i++){
    var av = AVATAR_OPTIONS[i];
    var cls = (av === nmSelectedAvatar) ? 'on' : '';
    html += '<button type="button" class="' + cls + '" data-av="' + escAttr(av) + '">' + av + '</button>';
  }
  wrap.innerHTML = html;
  var btns = wrap.querySelectorAll('button');
  for(var j=0; j<btns.length; j++){
    (function(b){
      b.addEventListener('click', function(){
        nmSelectedAvatar = b.getAttribute('data-av');
        var emojiEl = document.getElementById('nmEmoji');
        if(emojiEl) emojiEl.textContent = nmSelectedAvatar;
        var all = wrap.querySelectorAll('button');
        for(var k=0; k<all.length; k++) all[k].classList.remove('on');
        b.classList.add('on');
      });
    })(btns[j]);
  }
}
function confirmName(){
  if(!nmInputEl) nmInputEl = document.getElementById('nmInput');
  if(!nmInputEl) return;
  var val = (nmInputEl.value || '').trim();
  if(!val){ toast('名字不能为空哦～'); try { nmInputEl.focus(); } catch(e){} return; }
  if(val.length > 12) val = val.slice(0, 12);
  PROFILE.name = val;
  PROFILE.avatar = nmSelectedAvatar || DEFAULT_AVATAR;
  PROFILE.created = true;
  saveProfile();
  closeNameModal();
  updateUserDisplay();
  render(true);
  toast(nameModalMode === 'create' ? ('欢迎你，' + PROFILE.name + '！') : '名字已更新～');
}
function updateUserDisplay(){
  var nameEl = document.getElementById('userNameDisplay');
  var avatarEl = document.getElementById('avatarEmoji');
  var greetingEl = document.getElementById('userGreeting');
  if(nameEl) nameEl.innerHTML = escHtml(PROFILE.name) + '<span class="edit-icon">&#x270F;&#xFE0F;</span>';
  if(avatarEl) avatarEl.textContent = PROFILE.avatar || DEFAULT_AVATAR;
  if(greetingEl){
    var h = new Date().getHours(), g;
    if(h < 6) g = '夜深了';
    else if(h < 11) g = '早上好';
    else if(h < 14) g = '中午好';
    else if(h < 18) g = '下午好';
    else g = '晚上好';
    greetingEl.textContent = g;
  }
}

var KEY = 'ket_words_v6';
var DAY = 86400000;
var INTERVALS = [1, 2, 4, 7, 15, 30];
var SPELL_MAX_TRIES = 3;

function blankState(){
  return {
    cards:{}, history:{}, checkins:{}, checkinsList:[],
    settings:{ dailyNew:10, autoSpeak:true },
    spellMastered:{}
  };
}
var S = blankState();
try {
  var rawSaved = localStorage.getItem(KEY);
  if(rawSaved){
    var parsed = JSON.parse(rawSaved);
    if(parsed && typeof parsed === 'object'){
      if(parsed.cards) S.cards = parsed.cards;
      if(parsed.history) S.history = parsed.history;
      if(parsed.checkinsList && parsed.checkinsList.length !== undefined) S.checkinsList = parsed.checkinsList;
      if(parsed.settings){
        if(typeof parsed.settings.dailyNew === 'number') S.settings.dailyNew = parsed.settings.dailyNew;
        if(typeof parsed.settings.autoSpeak === 'boolean') S.settings.autoSpeak = parsed.settings.autoSpeak;
      }
      if(parsed.spellMastered) S.spellMastered = parsed.spellMastered;
    }
  }
} catch(e){
  S = blankState();
}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dstr(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return dstr(); }
function hist(){
  var t = today();
  if(!S.history[t]) S.history[t] = { 'new':0, rev:0, quizC:0, quizT:0 };
  return S.history[t];
}
function dueCards(){
  var now = Date.now(), r = [];
  for(var i=0; i<WORDS.length; i++){
    var c = S.cards[WORDS[i].w];
    if(c && c.n <= now) r.push(WORDS[i]);
  }
  return r;
}
function newWordList(){
  var r = [];
  for(var i=0; i<WORDS.length; i++){
    if(!S.cards[WORDS[i].w]) r.push(WORDS[i]);
  }
  return r;
}
function learnedCount(){ return Object.keys(S.cards).length; }
function masteredCount(){
  var n = 0;
  for(var k in S.cards){
    if(S.cards[k] && S.cards[k].s >= 6 && S.spellMastered[k]) n++;
  }
  return n;
}
function checkinCount(){ return (S.checkinsList && S.checkinsList.length) || 0; }
function hasCheckin(t){
  if(!S.checkinsList) return false;
  return S.checkinsList.indexOf(t) !== -1;
}

function calcStreak(){
  var set = {};
  for(var i=0; i<S.checkinsList.length; i++) set[S.checkinsList[i]] = 1;
  var d = new Date(), n = 0;
  if(!set[dstr(d)]) d.setDate(d.getDate() - 1);
  while(set[dstr(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function checkToday(){
  var h = hist();
  var due = dueCards().length;
  if(h['new'] >= S.settings.dailyNew && due === 0){
    var t = today();
    if(S.checkinsList.indexOf(t) === -1){
      S.checkinsList.push(t);
      S.checkinsList.sort();
      save();
      return true;
    }
  }
  return false;
}

function shuffle(a){
  var r = a.slice();
  for(var i=r.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}
function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function _doSpeak(text){
  try {
    if(!('speechSynthesis' in window)) return;

/* ==========================================================
   学习流程
   ========================================================== */
function startSession(){
  if(session && !session.done){
    currentTab = 'learn';
    updateTabs();
    render(true);
    return;
  }

  var h = hist();
  var due = shuffle(dueCards());
  var newLeft = Math.max(0, S.settings.dailyNew - h['new']);
  var fresh = newWordList().slice(0, newLeft);
  var queue = [];
  for(var i=0; i<due.length; i++) queue.push({
    o:due[i], requeued:false, spellTries:0, spellOk:false, isNew:false
  });
  for(var j=0; j<fresh.length; j++) queue.push({
    o:fresh[j], requeued:false, spellTries:0, spellOk:false, isNew:true
  });

  if(queue.length === 0){ toast('今天的任务已经完成啦'); return; }

  session = {
    queue: queue, idx:0, done:false, checked:false,
    phase: 'ask',
    stats:{ know:0, no:0, spellOK:0, spellFail:0 },
    counted:{}
  };
  currentTab = 'learn';
  updateTabs();
  render(true);

  if(S.settings.autoSpeak && session.queue[0]){
    var w0 = session.queue[0].o.w;
    setTimeout(function(){ speakAuto(w0); }, 320);
  }
}

function flipCard(){
  if(!session || session.done) return;
  var el = document.querySelector('.flash-card');
  if(el) el.classList.toggle('flipped');
}

function answerSession(rating){
  if(!session || session.done) return;
  if(session.phase !== 'ask') return;
  var item = session.queue[session.idx];
  var w = item.o.w;
  var isNew = !S.cards[w];
  var c = S.cards[w] || { s:0 };
  var ns, interval;
  if(rating === 'know'){
    ns = Math.min(c.s + 1, 6);
    interval = INTERVALS[ns - 1];
  } else {
    ns = 1; interval = 1;
  }
  S.cards[w] = { s: ns, n: Date.now() + interval * DAY, t: Date.now() };

  if(!session.counted[w]){
    session.counted[w] = 1;
    var h = hist();
    if(isNew) h['new']++; else h.rev++;
  }

  if(rating === 'no'){
    session.stats.no++;
    if(!item.requeued){
      item.requeued = true;
      session.queue.push(item);
    }
    // 关键修复：立即推进到下一个，避免「休息一下」后跳过
    session.phase = 'ask';
    save();
    advance();
    return;
  }

  session.stats.know++;

  // 认识 + 新词 → 进入拼写
  if(item.isNew === true && !item.spellOk){
    session.phase = 'spelling';
    item.spellTries = 0;
    save();
    render(true);
    setTimeout(function(){ speakManual(item.o.w); }, 260);
    return;
  }

  save();
  advance();
}

function submitSpelling(){
  if(!session || session.phase !== 'spelling') return;
  var item = session.queue[session.idx];
  var inputEl = document.getElementById('spellInput');
  if(!inputEl) return;
  var raw = (inputEl.value || '').trim();
  if(!raw){ toast('先写下答案吧～'); return; }

  var target = item.o.w.toLowerCase().replace(/\s+/g,' ').trim();
  var guess  = raw.toLowerCase().replace(/\s+/g,' ').trim();

  item.spellTries++;

  if(guess === target){
    item.spellOk = true;
    if(item.spellTries === 1){
      S.spellMastered[item.o.w] = true;
      session.stats.spellOK++;
      save();
      session.phase = 'spell-ok';
      render(true);
    } else {
      // 不是第一次就对 → 不算掌握
      if(S.spellMastered[item.o.w]) delete S.spellMastered[item.o.w];
      session.stats.spellFail++;
      save();
      session.phase = 'spell-fail';
      render(true);
    }
    return;
  }

  inputEl.classList.add('bad');
  inputEl.classList.remove('ok');

  if(item.spellTries >= SPELL_MAX_TRIES){
    session.stats.spellFail++;
    if(S.spellMastered[item.o.w]) delete S.spellMastered[item.o.w];
    save();
    session.phase = 'spell-fail';
    render(true);
    return;
  }

  var fbEl = document.getElementById('spellFeedback');
  if(fbEl){
    fbEl.className = 'spell-feedback bad';
    fbEl.textContent = '再想一想，还剩 ' + (SPELL_MAX_TRIES - item.spellTries) + ' 次机会';
  }
  try { inputEl.focus(); } catch(e){}
  try { inputEl.select(); } catch(e){}
}

function spellKeydown(e){
  if(e.key === 'Enter' || e.keyCode === 13){
    e.preventDefault();
    submitSpelling();
  }
}

function nextAfterSpellOK(){
  if(!session) return;
  session.phase = 'ask';
  advance();
}

function retryAfterSpellFail(){
  if(!session) return;
  var item = session.queue[session.idx];
  item.spellTries = 0;
  item.spellOk = false;
  item.requeued = true;
  session.queue.push(item);

  var w = item.o.w;
  S.cards[w] = { s:1, n: Date.now() + 1*DAY, t: Date.now() };
  if(S.spellMastered[w]) delete S.spellMastered[w];
  save();

  session.phase = 'ask';
  advance();
}

function advance(){
  if(!session) return;
  session.idx++;
  session.phase = 'ask';

  if(session.idx >= session.queue.length){
    session.done = true;
    session.checked = checkToday();
  }

  save();
  render(true);
  if(session && !session.done && S.settings.autoSpeak){
    var it = session.queue[session.idx];
    if(it){
      var w = it.o.w;
      setTimeout(function(){ speakAuto(w); }, 320);
    }
  }
}

/* ==========================================================

function startQuiz(){
  var learned = [];
  for(var i=0; i<WORDS.length; i++){
    if(S.cards[WORDS[i].w]) learned.push(WORDS[i]);
  }
  if(learned.length < 4){
    toast('至少先学 4 个单词才能开始测验哦～');
    return;
  }
  var pool = shuffle(learned).slice(0, Math.min(10, learned.length));
  var qs = [];
  for(var k=0; k<pool.length; k++){
    var o = pool[k];
    var same = [], other = [];
    for(var i2=0; i2<WORDS.length; i2++){
      if(WORDS[i2].w === o.w) continue;
      if(WORDS[i2].cat === o.cat) same.push(WORDS[i2]);
      else other.push(WORDS[i2]);
    }
    same = shuffle(same); other = shuffle(other);
    var distract = [];
    var merged = same.concat(other);
    for(var j=0; j<merged.length; j++){
      if(distract.length >= 3) break;
      var dup = false;
      for(var d=0; d<distract.length; d++){
        if(distract[d].w === merged[j].w){ dup = true; break; }
      }
      if(!dup) distract.push(merged[j]);
    }
    var opts = shuffle([o].concat(distract));
    var ansIdx = 0;
    for(var a=0; a<opts.length; a++){ if(opts[a].w === o.w){ ansIdx = a; break; } }
    qs.push({ o:o, opts:opts, ans:ansIdx });
  }
  quiz = { qs:qs, idx:0, correct:0, chosen:-1, revealed:false, finished:false };
  currentTab = 'quiz';
  updateTabs();
  render(true);
}
function answerQuiz(i){
  if(!quiz || quiz.revealed) return;
  quiz.chosen = i;
  quiz.revealed = true;
  if(i === quiz.qs[quiz.idx].ans) quiz.correct++;
  render();
}
function nextQuiz(){
  if(!quiz) return;
  quiz.idx++;
  quiz.chosen = -1;
  quiz.revealed = false;
  if(quiz.idx >= quiz.qs.length){
    var h = hist();
    h.quizC += quiz.correct;
    h.quizT += quiz.qs.length;
    save();
    quiz.finished = true;
  }
  render();
}
function exitQuiz(){ quiz = null; render(true); }

  if(!quiz){

    return '' +

          '<div class="stat"><b>' + h.quizT + '</b><small>今日答题</small></div>' +
          '<div class="stat"><b>' + h.quizC + '</b><small>答对</small></div>' +
          '<div class="stat"><b>' + rate + '%</b><small>正确率</small></div>' +
        '</div>' +
      '</div>' +
      '<button class="btn" onclick="KET.startQuiz()">开始测验</button>' +
      '<div class="card tip">' +
        '<b>小提示</b>' +
        '<p>答错的单词，之后会更常出现哦～多练几次就记住啦！</p>' +
      '</div>';
  }
  if(quiz.finished){
    var n = quiz.qs.length;
    var c = quiz.correct;
    var rate2 = Math.round(c/n*100);
    var emoji = '&#x1F4AA;', msg = '继续加油，你可以的！';
    if(rate2 >= 90){ emoji = '&#x1F3C6;'; msg = '太厉害了，几乎全对！'; }
    else if(rate2 >= 70){ emoji = '&#x1F389;'; msg = '很棒，掌握得不错！'; }
    else if(rate2 >= 50){ emoji = '&#x1F44D;'; msg = '还不错，再复习一下会更好～'; }
    return '' +
      '<div class="card center">' +
        '<div class="big-emoji">' + emoji + '</div>' +
        '<h2>' + c + ' / ' + n + ' 题正确</h2>' +
        '<p class="muted">' + msg + '（正确率 ' + rate2 + '%）</p>' +
      '</div>' +
      '<button class="btn" onclick="KET.startQuiz()">再测一次</button>' +
      '<button class="btn ghost" onclick="KET.exitQuiz()">返回</button>';
  }
  var q = quiz.qs[quiz.idx];
  var optsHtml = '';
  for(var i=0; i<q.opts.length; i++){
    var op = q.opts[i];
    var cls = '';
    if(quiz.revealed){
      if(i === q.ans) cls = 'right';
      else if(i === quiz.chosen) cls = 'wrong';
    }
    optsHtml += '<button class="opt ' + cls + '" ' + (quiz.revealed ? 'disabled' : '') +
      ' onclick="KET.answerQuiz(' + i + ')">' +
      '<span class="k">' + 'ABCD'[i] + '</span>' +
      '<span>' + escHtml(op.z) + '</span>' +
    '</button>';
  }
  return '' +
    '<div class="bar"><i style="width:' + (quiz.idx/quiz.qs.length*100).toFixed(1) + '%"></i></div>' +
    '<div class="learn-top">' +
      '<span>第 ' + (quiz.idx+1) + ' / ' + quiz.qs.length + ' 题</span>' +
      '<span>已答对 ' + quiz.correct + ' 题</span>' +
    '</div>' +
    '<div class="card" style="margin-top:12px">' +
      '<p class="muted small" style="text-align:center;margin:0 0 4px">选出正确的中文意思</p>' +
      '<div class="q-word">' + escHtml(q.o.w) + '</div>' +
      '<div style="text-align:center;margin-bottom:18px">' +
        '<button class="icon-btn" style="width:42px;height:42px;font-size:18px;display:inline-grid" ' +
          'onclick="KET.speakManual(\'' + escAttr(q.o.w) + '\')">&#x1F50A;</button>' +
      '</div>' +
      optsHtml +
    '</div>' +
    (quiz.revealed
      ? '<button class="btn" onclick="KET.nextQuiz()">' +
          (quiz.idx + 1 >= quiz.qs.length ? '查看结果' : '下一题') +
        '</button>'
      : '') +
    '<button class="btn ghost" onclick="KET.exitQuiz()">退出测验</button>';
}

/* ==========================================================
   词库
   ========================================================== */
function renderWords(){
  return '' +
    '<div class="search-wrap">' +
      '<input id="searchInput" placeholder="搜索英文或中文…" value="' + escAttr(wordQuery) + '" oninput="KET.onSearch(this)">' +
    '</div>' +
    '<div id="wordList"></div>';
}
function onSearch(el){ wordQuery = el.value.trim(); updateWordList(); }
function updateWordList(){
  var el = document.getElementById('wordList');
  if(!el) return;
  var q = wordQuery.toLowerCase();
  var html = '', cnt = 0;
  for(var i=0; i<WORDS.length; i++){
    var o = WORDS[i];
    if(q && o.w.toLowerCase().indexOf(q) === -1 && o.z.indexOf(q) === -1) continue;
    var c = S.cards[o.w];
    var cls = 'new', label = '未学';
    if(c){
      if(c.s >= 6 && S.spellMastered[o.w]){ cls = 'mastered'; label = '已掌握'; }
      else { cls = 'learning'; label = '学习中'; }
    }
    html += '<div class="word-row">' +
      '<div style="min-width:0">' +
        '<div class="wr-w">' + o.emoji + ' ' + escHtml(o.w) + '</div>' +
        '<div class="wr-z">' + escHtml(o.z) + '</div>' +
      '</div>' +
      '<div class="wr-right">' +
        '<span class="badge ' + cls + '">' + label + '</span>' +
        '<button class="icon-btn" onclick="KET.speakManual(\'' + escAttr(o.w) + '\')">&#x1F50A;</button>' +
      '</div>' +
    '</div>';
    cnt++;
  }
  if(cnt === 0){
    el.innerHTML = '<p class="muted" style="text-align:center;padding:30px 0">没有找到匹配的单词</p>';
  } else {
    el.innerHTML = html;
  }
}

/* ==========================================================
   我的
   ========================================================== */
function renderMe(){
  var learned = learnedCount();
  var mastered = masteredCount();
  var learning = learned - mastered;
  var opts = [5, 10, 15, 20];
  var segHtml = '';
  for(var i=0; i<opts.length; i++){
    var n = opts[i];
    segHtml += '<button class="' + (S.settings.dailyNew === n ? 'on' : '') + '" onclick="KET.setDaily(' + n + ')">' + n + '</button>';
  }
  return '' +
    '<div class="card center" style="padding-bottom:14px">' +
      '<div style="font-size:52px;line-height:1;margin-bottom:6px">' + escHtml(PROFILE.avatar || DEFAULT_AVATAR) + '</div>' +
      '<div style="font-size:22px;font-weight:800;margin-bottom:2px">' + escHtml(PROFILE.name) + '</div>' +
      '<p class="muted small" style="margin:4px 0 14px">这是我的 KET 学习档案</p>' +
      '<button class="btn small" style="max-width:200px;margin:0 auto" onclick="KET.openNameModal()">修改名字和头像</button>' +
    '</div>' +
    '<div class="card">' +
      '<b style="font-size:15px">每天学几个新词？</b>' +
      '<p class="muted small" style="margin:6px 0 0">建议 10 个左右，学得轻松才能坚持哦</p>' +
      '<div class="seg">' + segHtml + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<b style="font-size:15px">自动朗读</b>' +
      '<p class="muted small" style="margin:6px 0 0">出现新单词时自动读一遍英文</p>' +
      '<div class="seg">' +
        '<button class="' + (S.settings.autoSpeak ? 'on' : '') + '" onclick="KET.setSpeak(true)">打开</button>' +
        '<button class="' + (!S.settings.autoSpeak ? 'on' : '') + '" onclick="KET.setSpeak(false)">关闭</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<b style="font-size:15px">我的成绩单</b>' +
      '<div class="row"><span>词库总量</span><b>' + TOTAL_WORDS + ' 个</b></div>' +
      '<div class="row"><span>已学单词</span><b>' + learned + ' 个</b></div>' +
      '<div class="row"><span>已掌握</span><b>' + mastered + ' 个</b></div>' +
      '<div class="row"><span>学习中</span><b>' + learning + ' 个</b></div>' +
      '<div class="row"><span>累计打卡</span><b>' + checkinCount() + ' 天</b></div>' +
      '<div class="row"><span>连续打卡</span><b>' + calcStreak() + ' 天</b></div>' +
    '</div>' +
    '<div class="card">' +
      '<b style="font-size:15px">数据管理</b>' +
      '<p class="muted small" style="margin:8px 0 14px">学习记录保存在本机浏览器里，换设备或清理浏览器数据会丢失哦。</p>' +
      '<button class="btn ghost" onclick="KET.resetAll()" style="color:#E0526E;border-color:#FFD6E0;box-shadow:0 4px 0 #FFE3EA">清空全部学习记录</button>' +
    '</div>' +
    '<p class="muted small" style="text-align:center;padding:4px 0 12px">KET 单词乐园 · 祝你考试顺利</p>';
}
function setDaily(n){ S.settings.dailyNew = n; save(); render(); }
function setSpeak(v){ S.settings.autoSpeak = v; save(); render(); }
function resetAll(){
  if(!window.confirm('确定要清空全部学习记录吗？此操作不可恢复。')) return;
  if(!window.confirm('再确认一次：真的要清空吗？')) return;
  S = blankState(); session = null; quiz = null; save(); render(true);
  toast('已清空学习记录');
}

/* ==========================================================
   路由
   ========================================================== */
var VIEWS = { home:renderHome, learn:renderLearn, quiz:renderQuiz, words:renderWords, me:renderMe };

function render(resetScroll){
  if(!mainEl) mainEl = document.getElementById('main');
  if(!mainEl) return;
  try {
    mainEl.innerHTML = VIEWS[currentTab]();
    if(currentTab === 'words') updateWordList();
    if(resetScroll) mainEl.scrollTop = 0;
    var badge = document.getElementById('streakBadge');
    if(badge) badge.textContent = '连续 ' + calcStreak() + ' 天';
    updateUserDisplay();
    if(currentTab === 'learn' && session && session.phase === 'spelling'){
      var si = document.getElementById('spellInput');
      if(si) setTimeout(function(){ try { si.focus(); } catch(e){} }, 200);
    }
  } catch(err){
    try { console.error('[KET] 渲染失败', err); } catch(e){}
    mainEl.innerHTML = '' +
      '<div class="card center">' +
        '<div class="big-emoji">&#x1F62E;</div>' +
        '<h2>页面出错了</h2>' +
        '<p class="muted">请下拉刷新页面重试</p>' +
        '<p class="muted small">' + escHtml(err && err.message ? err.message : '未知错误') + '</p>' +
      '</div>';
  }
}

function updateTabs(){
  var btns = document.querySelectorAll('.tabbar button');
  for(var i=0; i<btns.length; i++){
    var b = btns[i];
    if(b.getAttribute('data-tab') === currentTab) b.classList.add('active');
    else b.classList.remove('active');
  }
}

/* ==========================================================
   对外 API
   ========================================================== */
window.KET = {
  startSession: startSession,
  flipCard: flipCard,
  answerSession: answerSession,
  submitSpelling: submitSpelling,
  spellKeydown: spellKeydown,
  nextAfterSpellOK: nextAfterSpellOK,
  retryAfterSpellFail: retryAfterSpellFail,
  exitSession: exitSession,
  backHome: backHome,
  continueSession: continueSession,
  startQuiz: startQuiz,
  answerQuiz: answerQuiz,
  nextQuiz: nextQuiz,
  exitQuiz: exitQuiz,
  onSearch: onSearch,
  setDaily: setDaily,
  setSpeak: setSpeak,
  resetAll: resetAll,
  speakManual: speakManual,
  openNameModal: openNameModal,
  closeNameModal: closeNameModal,
  confirmName: confirmName,
  stats: function(){
    return {
      total: TOTAL_WORDS,
      learned: learnedCount(),
      mastered: masteredCount(),
      name: PROFILE.name,
      avatar: PROFILE.avatar
    };
  }
};

/* ==========================================================
   启动
   ========================================================== */
function boot(){
  try {
    var btns = document.querySelectorAll('.tabbar button');
    for(var i=0; i<btns.length; i++){
      (function(btn){
        btn.addEventListener('click', function(){
          var t = btn.getAttribute('data-tab');
          if(t === currentTab) return;
          currentTab = t;
          updateTabs();
          render(true);
        });
      })(btns[i]);
    }
    updateTabs();
    render(true);
    updateUserDisplay();

    nameModalEl = document.getElementById('nameModal');
    nmInputEl = document.getElementById('nmInput');

    if(nmInputEl){
      nmInputEl.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.keyCode === 13){
          e.preventDefault();
          confirmName();
        }
      });
    }
    if(nameModalEl){
      nameModalEl.addEventListener('click', function(e){
        if(e.target === nameModalEl && nameModalMode === 'edit'){
          closeNameModal();
        }
      });
    }

    if(!PROFILE.created){
      setTimeout(function(){ openNameModal('create'); }, 400);
    }

    if(window.__KET_ERRORS__ && window.__KET_ERRORS__.length > 0){
      var first = window.__KET_ERRORS__[0];
      window.__KET_SHOW_ERROR__(first.msg);
      window.__KET_ERRORS__ = [];
    }

    try {
      console.log('[KET] 词库加载完成，共 ' + TOTAL_WORDS + ' 个单词；用户：' + PROFILE.name);
    } catch(e){}
  } catch(err){
    try { console.error('[KET] 启动失败', err); } catch(e){}
    var m = document.getElementById('main');
    if(m){
      m.innerHTML = '<div class="card center">' +
        '<div class="big-emoji">&#x1F62E;</div>' +
        '<h2>加载失败</h2>' +
        '<p class="muted">' + escHtml(err && err.message ? err.message : '未知错误') + '</p>' +
      '</div>';
    }
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
